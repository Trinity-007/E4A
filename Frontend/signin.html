<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In - E4A</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <a class="brand-link" href="index.html">E4A</a>
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Sign in with your email to continue</p>
    
    <form id="signin-form">
      <div class="form-group">
        <label for="signin-email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="signin-email" 
          placeholder="Enter your email" 
          autocomplete="email"
          autofocus
          required 
        />
        <span id="email-hint" class="email-hint" style="display:none;font-size:0.85em;color:#666;margin-top:5px;">We'll send a verification link to this email</span>
      </div>

      <div class="form-group">
        <label for="signin-password" class="form-label">Password</label>
        <input 
          type="password" 
          id="signin-password" 
          placeholder="Enter your password" 
          autocomplete="current-password"
          required 
        />
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" id="signin-remember" />
        <label for="signin-remember">Keep me signed in</label>
      </div>

      <button class="btn gold" type="submit" id="signin-btn">Sign In with Email</button>
    </form>

    <p id="signin-error" style="color:#d32f2f;margin-top:15px;display:none;padding:10px;background:#ffebee;border-radius:4px;"></p>
    
    <div class="auth-links">
      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      <p><a href="javascript:void(0)" id="forgot-password-link">Forgot password?</a></p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Reset Password</h3>
      <p>Enter your email address and we'll send you instructions to reset your password.</p>
      <form id="forgot-form" style="margin-top:20px;">
        <input 
          type="email" 
          id="forgot-email" 
          placeholder="Enter your email" 
          autocomplete="email"
          required 
        />
        <button class="btn gold" type="submit" style="margin-top:10px;width:100%;">Send Reset Link</button>
      </form>
      <p id="forgot-error" style="color:#d32f2f;margin-top:10px;display:none;"></p>
      <p id="forgot-success" style="color:#388e3c;margin-top:10px;display:none;"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact - E4A</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="brand"><a href="index.html">E4A</a></div>
      <div class="nav-right">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="contact content-card">
      <h1>Contact Us</h1>
      <div class="contact-grid">
        <div class="contact-left">
          <form id="contact-form" class="contact-form">
            <input id="contact-name" required type="text" placeholder="Full name" />
            <input id="contact-email" required type="email" placeholder="Email" />
            <input id="contact-subject" type="text" placeholder="Subject (optional)" />
            <textarea id="contact-message" required placeholder="Your message"></textarea>
            <div style="display:flex;gap:10px;align-items:center">
              <button class="btn gold" type="submit">Send Message</button>
              <button class="btn" type="reset">Reset</button>
            </div>
          </form>
        </div>

        <aside class="contact-right">
          <div class="contact-details">
            <h3>Our Location</h3>
            <p class="muted">E4A Headquarters<br/>Lagos, Nigeria</p>
            <p><strong>Phone:</strong> +234 800 000 0000</p>
            <p><strong>Email:</strong> <a href="mailto:info@e4a.example">info@e4a.example</a></p>
          </div>

          <div id="contact-map" class="contact-map">
            <!-- Embedded Google Map centered on Lagos, Nigeria. Replace or update coordinates as needed. -->
            <iframe
              src="https://www.google.com/maps?q=lagos+nigeria&output=embed"
              width="100%" height="260" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <div>© 2025 E4A</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Backend Connection Test</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .pass { background: #d4edda; color: #155724; }
    .fail { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>E4A Backend Connection Test</h1>
  <div id="results"></div>
  
  <script>
    const API_BASE = 'http://localhost:3000/api';
    const results = document.getElementById('results');
    
    async function test() {
      // Test 1: Products
      try {
        const res = await fetch(`${API_BASE}/products`);
        const data = await res.json();
        const count = Array.isArray(data) ? data.length : 0;
        addResult('Products API', res.ok, `Loaded ${count} products from MongoDB`);
      } catch (e) {
        addResult('Products API', false, e.message);
      }
      
      // Test 2: Auth Register
      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Test User', email: 'test@example.com', password: 'password123' })
        });
        const data = await res.json();
        addResult('Auth Register', res.ok || res.status === 409, data.user ? `User registered` : (data.error || 'Response received'));
      } catch (e) {
        addResult('Auth Register', false, e.message);
      }
      
      // Test 3: Orders
      try {
        const res = await fetch(`${API_BASE}/orders`);
        const data = await res.json();
        addResult('Orders API', res.ok, `Orders endpoint working`);
      } catch (e) {
        addResult('Orders API', false, e.message);
      }
      
      // Test 4: MongoDB Connection
      try {
        const res = await fetch(`${API_BASE}/products`);
        addResult('MongoDB', res.ok, 'Database connection working');
      } catch (e) {
        addResult('MongoDB', false, 'Database connection failed');
      }
    }
    
    function addResult(name, pass, message) {
      const div = document.createElement('div');
      div.className = `test ${pass ? 'pass' : 'fail'}`;
      div.innerHTML = `<strong>${pass ? '✓' : '✗'} ${name}</strong>: ${message}`;
      results.appendChild(div);
    }
    
    test();
  </script>
</body>
</html>

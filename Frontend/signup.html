<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up - E4A</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <a class="brand-link" href="index.html">E4A</a>
    <h2>Create an account</h2>
    <form id="signup-form">
      <input type="text" id="signup-name" placeholder="Full name" required />
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required minlength="6" />
      <button class="btn gold" type="submit">Create Account</button>
    </form>
    <p id="signup-error" style="color:red;margin-top:10px;display:none;"></p>
    <p>Already have an account? <a href="signin.html">Sign in</a></p>
  </div>
  <script src="script.js"></script>
</body>
</html>

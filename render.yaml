services:
  - type: web
    name: e4a-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://user:password@cluster.mongodb.net/e4a_db
      - key: JWT_SECRET
        value: your_strong_secret_key_min_32_chars
      - key: PORT
        value: 10000
